<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Invitación de boda de Malú y Gibran" />

    <title>Malú & Gibran | Nuestra Boda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
    <main class="wedding-page">

        <section class="hero" id="hero">

            <img src="./assets/illustrations/olive-branch-left.svg" alt="" class="hero__branch hero__branch--left" />

            <img src="./assets/illustrations/olive-branch-right.svg" alt="" class="hero__branch hero__branch--right" />

            <header class="hero__header">

                <div class="hero__monogram">
                    <span class="hero__monogram-inner">
                        M&G
                    </span>
                </div>

                <p class="hero__eyebrow">
                    Nos casamos
                </p>

                <div class="hero__divider">
                    <span></span>
                    <i>◆</i>
                    <span></span>
                </div>

                <h1 class="hero__names">
                    Malú & Gibran
                </h1>

                <p class="hero__date">
                    12 · DICIEMBRE · 2026
                </p>

                <div class="hero__ornament" aria-hidden="true">
                    <span class="hero__ornament-line"></span>

                    <span class="hero__ornament-center">
                        <i></i>
                    </span>

                    <span class="hero__ornament-line"></span>
                </div>

            </header>

            <div class="hero__invitation">

                <button class="envelope" id="openInvitation" type="button"
                    aria-label="Abrir invitación de Malú y Gibran">

                    <span class="envelope__body">

                        <!-- Carta -->
                        <img src="./assets/images/envelope/invitation-card.png" class="envelope__card" alt="" />

                        <!-- Base del sobre -->
                        <img src="./assets/images/envelope/envelope-base.png" class="envelope__base" alt="" />

                        <!-- Solapa -->
                        <img src="./assets/images/envelope/envelope-flap.png" class="envelope__flap" alt="" />

                        <!-- Sello -->
                        <img src="./assets/images/envelope/wax-seal.png" class="envelope__seal" alt="" />

                    </span>

                </button>

                <div class="hero__action">

                    <span class="hero__click">
                        Clic para abrir
                    </span>

                    <span class="hero__subtitle">
                        nuestra invitación
                    </span>

                </div>

            </div>

        </section>

    </main>

    <script src="./js/config.js"></script>
    <script src="./js/invitation.js"></script>
</body>

</html>
